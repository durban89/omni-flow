app:
  site_name: "CondomIQ"
  base_url: "https://condomiq.com"
  default_locale: "en-US"

# Per-mode overrides, deep-merged over the base config below. `test` publishes to
# a separate Pages project; production keeps the base `cloudflare.pages_project`.
modes:
  test:
    cloudflare:
      pages_project: "condom-iq-dev"
      worker_name: "condom-iq-router-dev"
  production:
    cloudflare:
      pages_project: "condom-iq"
      worker_name: "condom-iq-router"

pipeline:
  output_dir: "01-local-worker/build/public"
  data_dir: "01-local-worker/build/data"
  max_items_per_run: 50
  require_human_review: true

build:
  site_dir: "03-distribution/site"
  hugo_binary: "hugo"

scraper:
  user_agent: "OmniFlowBot/0.1 (+https://example.com/bot)"
  request_timeout_seconds: 20
  request_delay_ms: 1500
  respect_robots_txt: true
  continue_on_error: true
  max_items_per_run: 200
  sources:
    # 1. 本地 JSON 数据源 (Local JSON)
    - id: curated_local
      type: json_file
      enabled: true
      path: "config/curated-input.example.json"
      default_category: "guides"
      default_tags: ["curated", "checklist"]
      max_items: 10

    # 2. 实时公开 RSS 订阅源 (Live Public RSS Feed)
    - id: bbc_technology_rss
      type: rss
      enabled: true
      url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
      default_category: "technology"
      default_tags: ["news", "rss"]
      max_items: 5

    # 3. 动态渲染页面抓取 (Playwright Dynamic JavaScript Page)
    - id: dynamic_quotes_page
      type: playwright
      enabled: false
      url: "https://quotes.toscrape.com/js/"
      wait_selector: ".quote"
      default_category: "quotes"
      default_tags: ["dynamic", "javascript"]
      timeout_ms: 20000

    # 4. 选题发现 (Search API)：只保留标题 / URL / 短摘要作为选题线索，正文由
    #    content 阶段从零撰写，不转载第三方内容。需要 .env 里的 EXA_API_KEY。
    #    queries 就是选题池：一个 query 视作一个选题，按主题分组扩充（尺寸、
    #    价格、材质、使用场景……），尽量覆盖不同搜索意图，避免互相抢词。
    #    用过的 query 会让位给没用过的；全部用过时才会回查旧 query，重复内容靠
    #    URL 与标题相似度拦截。max_attempts 不小于 query 数，避免某条 query 长期
    #    没有新线索时把后面的选题饿死。
    - id: topic_discovery
      type: topic_search
      enabled: false
      provider: exa
      api_key_env: "EXA_API_KEY"
      queries:
        - "how to compare product specifications before buying"
        - "common mistakes when choosing the right product size"
        - "cheap vs expensive product materials comparison"
        - "how to check warranty and return policy"
      num_results: 8
      max_items: 20
      # 同一 query 取得越多结果，越容易写成几篇几乎一样的文章；默认只取 1 条。
      max_items_per_query: 1
      max_attempts: 30
      default_category: "guides"
      default_tags: ["topic", "guides"]

cloudflare:
  pages_project: "condom-iq"
  worker_name: "condom-iq-router"
  kv_namespace_binding: "APP_KV"
  r2_bucket_binding: "ASSETS_R2"
  # Namespace IDs are not committed; set them in .env instead:
  #   production -> CLOUDFLARE_KV_NAMESPACE_ID_PROD
  #   test       -> CLOUDFLARE_KV_NAMESPACE_ID_DEV
  # This variable, when set, overrides the mode-based pick.
  kv_namespace_env: "CLOUDFLARE_KV_NAMESPACE_ID"

compliance:
  require_affiliate_disclosure: true
  require_content_rating: true
  require_expert_review: true
  allow_unlicensed_scraping: false
  default_content_rating: "general"

llm:
  enable: true
  model: "gpt-4o-mini"
  temperature: 0.3
  max_words: 1200
  # Optional free fallback, tried when the primary provider returns an error.
  # Groq's OpenAI-compatible API has a free tier (no card); set GROQ_API_KEY.
  fallback_base_url: "https://api.groq.com/openai/v1"
  fallback_model: "openai/gpt-oss-120b"
  fallback_api_key_env: "GROQ_API_KEY"
  # Keyless alternatives when Groq is unreachable from your network:
  #   fallback_base_url: "https://text.pollinations.ai/openai"
  #   fallback_model: "openai"
  #   fallback_api_key_env: ""
