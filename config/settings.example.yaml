app:
  site_name: "OmniFlow"
  base_url: "https://example.com"
  default_locale: "en"

pipeline:
  output_dir: "01-local-worker/build/public"
  data_dir: "01-local-worker/build/data"
  max_items_per_run: 50
  require_human_review: true

build:
  site_dir: "03-distribution/site"
  hugo_binary: "hugo"

scraper:
  user_agent: "OmniFlowBot/0.1 (+https://example.com/bot)"
  request_timeout_seconds: 20
  request_delay_ms: 1500
  respect_robots_txt: true
  continue_on_error: true
  max_items_per_run: 200
  sources:
    # 1. 本地 JSON 数据源 (Local JSON)
    - id: curated_local
      type: json_file
      enabled: true
      path: "config/curated-input.example.json"
      default_category: "guides"
      default_tags: ["curated", "checklist"]
      max_items: 10

    # 2. 实时公开 RSS 订阅源 (Live Public RSS Feed)
    - id: bbc_technology_rss
      type: rss
      enabled: true
      url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
      default_category: "technology"
      default_tags: ["news", "rss"]
      max_items: 5

    # 3. 动态渲染页面抓取 (Playwright Dynamic JavaScript Page)
    - id: dynamic_quotes_page
      type: playwright
      enabled: false
      url: "https://quotes.toscrape.com/js/"
      wait_selector: ".quote"
      default_category: "quotes"
      default_tags: ["dynamic", "javascript"]
      timeout_ms: 20000

content:
  model: "gpt-4o-mini"
  temperature: 0.3
  max_words: 1200

cloudflare:
  pages_project: "example-matrix"
  worker_name: "cps-edge-router"
  kv_namespace_binding: "APP_KV"
  r2_bucket_binding: "ASSETS_R2"

compliance:
  require_affiliate_disclosure: true
  require_content_rating: true
  require_expert_review: true
  allow_unlicensed_scraping: false
  default_content_rating: "general"

llm:
  enable: true
